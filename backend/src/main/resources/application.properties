spring.application.name=scouts-project

# ==== Perfil activo ====
spring.profiles.active=${APP_PROFILE:development}

# ==== Base de Datos Supabase ====
spring.datasource.url=${DB_URL}
supabase.url=${SUPABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
supabase.service.role.key=${BD_ROLE_KEY}
spring.datasource.publicBucket=${SUPABASE_BUCKET}
supabase.storage.bucket=${SUPABASE_BUCKET}
supabase.images.bucket=${SUPABASE_BUCKET}
supabase.files.bucket=${SUPABASE_BUCKET}
# ==== Hibernate ==== 
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SHOW_SQL:false}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.enabled=false


# ==== Servidor ====
server.port=${SERVER_PORT:8080}