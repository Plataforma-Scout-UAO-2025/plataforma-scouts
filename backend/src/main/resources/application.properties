spring.application.name=scouts-project

# ==== Perfil activo ====
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}

# ==== Hibernate ====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==== Auth0 / Okta ====
okta.oauth2.issuer=https://dev-peshzy4g14jvfyku.us.auth0.com/
okta.oauth2.audience=https://scouts-backend.fly.dev/
auth0.domain=dev-peshzy4g14jvfyku.us.auth0.com
auth0.audience=https://dev-peshzy4g14jvfyku.us.auth0.com/api/v2/
auth0.management.eager-init=true
auth0.management.background-refresh.enabled=true
auth0.management.refresh-check-interval=300000
authz.cache.ttl-millis=300000

# ==== Supabase Storage ====
SUPABASE_STORAGE_FOLDER=organigrama
SUPABASE_STORAGE_SIGN_TTL=3600

# ==== Liquibase / Hibernate ====
HIBERNATE_DDL_AUTO=validate
SHOW_SQL=false
LIQUIBASE_ENABLED=false