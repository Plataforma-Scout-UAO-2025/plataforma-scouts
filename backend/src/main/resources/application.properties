spring.application.name=scouts-project

# ==== Perfil activo ====
spring.profiles.active=${APP_PROFILE:development}

# ==== Base de Datos ====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==== Hibernate ====
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SHOW_SQL}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==== Liquibase ====
spring.liquibase.enabled=${LIQUIBASE_ENABLED}

# ==== Servidor ====
server.port=${SERVER_PORT}

# ==== Supabase (opcional para llamadas REST) ====
supabase.url=${SUPABASE_URL}
supabase.anon.key=${SUPABASE_ANON_KEY}
