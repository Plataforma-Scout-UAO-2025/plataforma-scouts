spring.application.name=scouts-project

# ==== Profile / Server ====
spring.profiles.active=${APP_PROFILE:development}
server.port=${SERVER_PORT:8080}

# ==== Datasource (Supabase PostgreSQL) ====
spring.datasource.url=${DB_URL_QBYTE}
spring.datasource.username=${DB_USER_QBYTE}
spring.datasource.password=${DB_PASSWORD_QBYTE}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==== JPA / Hibernate ====
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ==== Liquibase ====
spring.liquibase.change-log=classpath:db/changelog/master.xml
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}

spring.flyway.enabled=false