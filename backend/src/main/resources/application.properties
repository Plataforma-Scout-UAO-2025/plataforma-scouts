spring.application.name=scouts-project

# ==== Perfil activo ====
spring.profiles.active=${APP_PROFILE:development}

# ==== Base de Datos ====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
supabase.service.role.key=${BD_ROLE_KEY}
supabase.images.bucket=${SUPABASE_BUCKET}
supabase.url=${SUPABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.servlet.multipart.enabled=true
# ==== Hibernate ==== 
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
# ==== Servidor ====
server.port=${SERVER_PORT:8080}
