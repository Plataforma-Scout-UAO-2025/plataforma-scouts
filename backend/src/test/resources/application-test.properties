# Test Configuration with H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration for H2 with Hypersistence Utils
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for tests (H2 creates schema automatically)
spring.flyway.enabled=false

# H2 Console (for debugging if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mock Supabase configuration for tests (exact property names from SupabaseConfig)
supabase.url=http://localhost:8000
supabase.anon.key=test-anon-key
supabase.service.role.key=test-service-key
supabase.storage.bucket=test-bucket
supabase.images.bucket=test-images
supabase.files.bucket=test-files

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Test specific settings
spring.test.database.replace=none
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false