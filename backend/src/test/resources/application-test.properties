# Test Configuration with H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Test specific settings
spring.test.database.replace=none

OKTA_OAUTH2_ISSUER=https://dummy.local.dev/oauth2/default
OKTA_OAUTH2_AUDIENCE=api://default-test

auth0.domain=dev-xxxxx12345.us.auth0.com
auth0.clientId=FAKE1234567890CLIENTID
auth0.clientSecret=FAKE1234567890CLIENTSECRET
auth0.audience=https://dev-xxxxx12345.us.auth0.com/api/v2/

auth0.management.eager-init=true
auth0.management.background-refresh.enabled=true
auth0.management.refresh-check-interval=300000
authz.cache.ttl-millis=300000