# Test Configuration with H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Test specific settings
spring.test.database.replace=none

auth0.domain=dev-xxxxx12345.us.auth0.com
auth0.clientId=FAKE1234567890CLIENTID
auth0.clientSecret=FAKE1234567890CLIENTSECRET
auth0.audience=https://dev-xxxxx12345.us.auth0.com/api/v2/

auth0.management.eager-init=true
auth0.management.background-refresh.enabled=true
auth0.management.refresh-check-interval=300000
authz.cache.ttl-millis=300000

auth0.connections.password-policy=good
auth0.connections.enabled-clients=client1,client2,client1
auth0.connections.disable-signup=false
auth0.connections.dry-run=true

# Dummy environment placeholders required
APP_PROFILE=test

DB_URL=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
DB_USER=sa
DB_PASSWORD=

SUPABASE_URL=https://supabase.local.dev
SUPABASE_BUCKET=test-images
BD_ROLE_KEY=test-service-role-key

OKTA_OAUTH2_ISSUER=https://dummy.local.dev/oauth2/default
OKTA_OAUTH2_AUDIENCE=api://default-test

AUTH0_DOMAIN=dev-xxxxx12345.us.auth0.com
AUTH0_CLIENT_ID=FAKE1234567890CLIENTID
AUTH0_CLIENT_SECRET=FAKE1234567890CLIENTSECRET
AUTH0_AUDIENCE=https://dev-xxxxx12345.us.auth0.com/api/v2/
AUTH0_MANAGEMENT_EAGER_INIT=true
AUTH0_MANAGEMENT_BACKGROUND_REFRESH_ENABLED=true
AUTH0_MANAGEMENT_REFRESH_CHECK_INTERVAL=300000
AUTHZ_CACHE_TTL_MILLIS=300000


# Supabase explicit overrides consumed by SupabaseConfig
supabase.url=https://supabase.local.dev
supabase.anon.key=test-anon-key
supabase.service.role.key=test-service-role-key
supabase.storage.bucket=test-storage
supabase.images.bucket=test-images
supabase.files.bucket=test-files


SUPERUSER_PASSWORD=dummyPassword
SUPERUSER_EMAIL=dummy@dummy.com
SUPERUSER_USERNAME=dummyuser